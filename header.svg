<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#203a43;#0f2027" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#1c6e8c;#2c5364" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ADD8"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 64px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: url(#txt); animation: fade 1.6s ease-out both; }
    .role { font: 500 22px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #cfe8f3; animation: fade 1.6s ease-out .6s both; letter-spacing: 1px; }
    .star { fill: #ffffff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle class="star" cx="90" cy="40" r="2"/>
  <circle class="star" cx="260" cy="90" r="1.5" style="animation-delay:.8s"/>
  <circle class="star" cx="420" cy="30" r="2" style="animation-delay:1.6s"/>
  <circle class="star" cx="780" cy="45" r="1.5" style="animation-delay:.4s"/>
  <circle class="star" cx="950" cy="85" r="2" style="animation-delay:1.2s"/>
  <circle class="star" cx="1120" cy="35" r="1.5" style="animation-delay:2s"/>
  <circle class="star" cx="1060" cy="140" r="1.5" style="animation-delay:2.4s"/>
  <circle class="star" cx="150" cy="150" r="1.5" style="animation-delay:1.8s"/>
  <text class="name" x="600" y="115" text-anchor="middle">Ali Ullah</text>
  <text class="role" x="600" y="160" text-anchor="middle">Backend &amp; Full-Stack Software Engineer</text>
  <path fill="#0d1117" fill-opacity="0.55" d="M0 215 Q300 185 600 215 T1200 215 V260 H0 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 215 Q300 185 600 215 T1200 215 V260 H0 Z;
              M0 215 Q300 245 600 215 T1200 215 V260 H0 Z;
              M0 215 Q300 185 600 215 T1200 215 V260 H0 Z"/>
  </path>
  <path fill="#0d1117" d="M0 235 Q300 255 600 235 T1200 235 V260 H0 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 235 Q300 255 600 235 T1200 235 V260 H0 Z;
              M0 235 Q300 215 600 235 T1200 235 V260 H0 Z;
              M0 235 Q300 255 600 235 T1200 235 V260 H0 Z"/>
  </path>
</svg>
