<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#050816"/><stop offset="55%" stop-color="#0f2027"/><stop offset="100%" stop-color="#2c5364"/>
 </linearGradient>
 <radialGradient id="nebula1" cx="0.2" cy="0.3" r="0.5"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
 <radialGradient id="nebula2" cx="0.85" cy="0.4" r="0.45"><stop offset="0%" stop-color="#00ADD8" stop-opacity=".30"/><stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/></radialGradient>
