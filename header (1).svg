<style>
 .tw{fill:#fff;animation:tw 3s ease-in-out infinite}
 @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
 .name{font:800 72px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif;fill:url(#txt);animation:up 1.4s ease-out both}
 .role{font:500 22px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif;fill:#cfe8f3;letter-spacing:3px;animation:up 1.4s ease-out .5s both}
 @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 .shoot{animation:shoot 7s linear infinite;opacity:0}
 .s2{animation-delay:3.5s}
 @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}12%{transform:translate(520px,180px);opacity:0}100%{transform:translate(520px,180px);opacity:0}}
 .orb{animation:orb 9s ease-in-out infinite}
 @keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
