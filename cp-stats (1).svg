<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="190" viewBox="0 0 1180 190">
<style>
 .v{font:800 38px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif} .l{font:500 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif;fill:#8b949e;letter-spacing:1px}
 .card{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
 @keyframes pop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
 .pulse{animation:pulse 3s ease-in-out infinite}
 @keyframes pulse{0%,100%{stroke-opacity:0}50%{stroke-opacity:.9}}
</style>
<g class="card" style="animation-delay:0.00s">
 <rect x="20" y="20" width="270" height="150" rx="16" fill="#0d1117" stroke="#61DAFB" stroke-opacity=".45"/>
 <rect x="20" y="20" width="270" height="150" rx="16" fill="none" stroke="#61DAFB" stroke-width="2" class="pulse" style="animation-delay:0.00s"/>
 <text x="155.0" y="62" text-anchor="middle" font-size="26">🧠</text>
 <text x="155.0" y="112" text-anchor="middle" class="v" fill="#61DAFB">2,000+</text>
 <text x="155.0" y="145" text-anchor="middle" class="l">Problems Solved</text>
</g><g class="card" style="animation-delay:0.25s">
 <rect x="310" y="20" width="270" height="150" rx="16" fill="#0d1117" stroke="#c084fc" stroke-opacity=".45"/>
 <rect x="310" y="20" width="270" height="150" rx="16" fill="none" stroke="#c084fc" stroke-width="2" class="pulse" style="animation-delay:0.25s"/>
 <text x="445.0" y="62" text-anchor="middle" font-size="26">⚔️</text>
 <text x="445.0" y="112" text-anchor="middle" class="v" fill="#c084fc">180+</text>
 <text x="445.0" y="145" text-anchor="middle" class="l">Contests</text>
</g><g class="card" style="animation-delay:0.50s">
 <rect x="600" y="20" width="270" height="150" rx="16" fill="#0d1117" stroke="#4ade80" stroke-opacity=".45"/>
 <rect x="600" y="20" width="270" height="150" rx="16" fill="none" stroke="#4ade80" stroke-width="2" class="pulse" style="animation-delay:0.50s"/>
 <text x="735.0" y="62" text-anchor="middle" font-size="26">📈</text>
 <text x="735.0" y="112" text-anchor="middle" class="v" fill="#4ade80">Pupil</text>
 <text x="735.0" y="145" text-anchor="middle" class="l">Codeforces</text>
</g><g class="card" style="animation-delay:0.75s">
 <rect x="890" y="20" width="270" height="150" rx="16" fill="#0d1117" stroke="#fbbf24" stroke-opacity=".45"/>
 <rect x="890" y="20" width="270" height="150" rx="16" fill="none" stroke="#fbbf24" stroke-width="2" class="pulse" style="animation-delay:0.75s"/>
 <text x="1025.0" y="62" text-anchor="middle" font-size="26">🏆</text>
 <text x="1025.0" y="112" text-anchor="middle" class="v" fill="#fbbf24">2nd</text>
 <text x="1025.0" y="145" text-anchor="middle" class="l">Hackify Fest</text>
</g>
</svg>