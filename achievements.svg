<svg xmlns="http://www.w3.org/2000/svg" width="900" height="376" viewBox="0 0 900 376">
<defs><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="0" y1="46" x2="0" y2="326"><stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#61DAFB"/></linearGradient></defs>
